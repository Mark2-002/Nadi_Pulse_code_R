# Enable Bluetooth LE peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="NADI_PULSE_AV"

# Needed to request larger ATT MTU and data length
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
 
# (Optional but recommended) allow PHY updates if you want 2M PHY later
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y

# Stack sizes – typical for BLE apps using logging
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048

# Logging/printk (enable if you use printk/LOG_INF, etc.)
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y

# I2C + sensors for your MAX30102 / fuel gauge
CONFIG_I2C=y
CONFIG_SENSOR=y

# Fuel gauge (if you use Nordic’s fuel gauge library)
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y


# Enable dynamic MTU and Data Length Extension
# CONFIG_BT_GATT_DYNAMIC_MTU=y
# CONFIG_BT_MAX_MTU=247
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
# Allow more concurrent ACL/GATT TX buffers
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_BUF_CMD_TX_COUNT=10
CONFIG_BT_CTLR_PHY_CODED=y

CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.1.0"
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y